<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飲食紀錄報告</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-2xl mx-auto p-4 space-y-6">
    <div id="loading" class="text-center py-16 text-gray-400">載入中...</div>
    <div id="error" class="hidden text-center py-16 text-red-500 text-lg font-medium"></div>
    <div id="content" class="hidden space-y-6"></div>
  </div>

  <script>
    // Replace with your Cloudflare Workers URL after deployment
    const API_BASE = 'https://diet-tracker.csc981-04.workers.dev'

    const MEAL_LABELS = { breakfast: '🍳 早餐', lunch: '🍱 午餐', dinner: '🍜 晚餐', snack: '🍪 點心' }

    function showError(msg) {
      document.getElementById('loading').classList.add('hidden')
      const el = document.getElementById('error')
      el.textContent = msg
      el.classList.remove('hidden')
    }

    async function load() {
      const match = location.pathname.match(/\/report\/(.+)/)
      const token = match?.[1]
      if (!token) return showError('無效的報告連結')

      let data
      try {
        const res = await fetch(`${API_BASE}/api/report/${token}`)
        if (res.status === 410) return showError('此連結已過期，請重新向 Bot 輸入 /report 產生新連結')
        if (!res.ok) return showError('報告載入失敗，請稍後再試')
        data = await res.json()
      } catch {
        return showError('網路錯誤，請稍後再試')
      }

      render(data)
    }

    function render(data) {
      document.getElementById('loading').classList.add('hidden')
      const content = document.getElementById('content')
      content.classList.remove('hidden')

      // Header
      const header = document.createElement('div')
      header.innerHTML = `
        <h1 class="text-2xl font-bold text-gray-800">飲食紀錄報告</h1>
        <p class="text-sm text-gray-500 mt-1">${data.dateFrom} ～ ${data.dateTo}</p>
      `
      content.appendChild(header)

      // Weight chart
      if (data.weights && data.weights.length > 0) {
        const chartSection = document.createElement('div')
        chartSection.className = 'bg-white rounded-2xl shadow-sm p-4'
        chartSection.innerHTML = `
          <h2 class="text-base font-semibold text-gray-700 mb-3">⚖️ 體重趨勢</h2>
          <canvas id="weightChart" height="120"></canvas>
        `
        content.appendChild(chartSection)

        new Chart(document.getElementById('weightChart'), {
          type: 'line',
          data: {
            labels: data.weights.map(w => w.date.slice(5)),
            datasets: [{
              label: '體重 (kg)',
              data: data.weights.map(w => w.kg),
              borderColor: '#3B82F6',
              backgroundColor: 'rgba(59,130,246,0.08)',
              borderWidth: 2,
              pointBackgroundColor: '#3B82F6',
              tension: 0.35,
              fill: true,
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { ticks: { callback: v => `${v}kg` } }
            }
          }
        })
      }

      // Daily records (newest first)
      const days = Object.keys(data.days).sort().reverse()
      for (const date of days) {
        const day = data.days[date]
        const section = document.createElement('div')
        section.className = 'bg-white rounded-2xl shadow-sm p-4 space-y-3'

        let html = `<h3 class="font-semibold text-gray-800 border-b border-gray-100 pb-2">${date}</h3>`

        if (day.weight) {
          html += `<p class="text-sm text-gray-600">⚖️ 空腹體重：<span class="font-medium">${day.weight}kg</span></p>`
        }

        if (day.exercises && day.exercises.length > 0) {
          const exList = day.exercises.map(e => `${e.exercise_type} ${e.duration_minutes}分鐘`).join('、')
          html += `<p class="text-sm text-gray-600">🏃 運動：<span class="font-medium">${exList}</span></p>`
        }

        for (const [type, label] of Object.entries(MEAL_LABELS)) {
          const meal = day.meals[type]
          if (!meal) continue
          html += `
            <div class="border-t border-gray-50 pt-2">
              <p class="text-sm font-medium text-gray-700">${label}：${meal.description || '（未填寫）'}</p>
              ${meal.photo_url ? `
                <div class="mt-2 cursor-pointer group" onclick="openLightbox('${meal.photo_url}')">
                  <img src="${meal.photo_url}" loading="lazy" class="rounded-xl w-full max-h-80 object-contain bg-gray-50 group-hover:opacity-90 transition-opacity" />
                  <p class="text-xs text-center text-gray-400 mt-1">🔍 點擊放大</p>
                </div>
              ` : ''}
            </div>
          `
        }

        section.innerHTML = html
        content.appendChild(section)
      }

      if (days.length === 0) {
        const empty = document.createElement('p')
        empty.className = 'text-center text-gray-400 py-8'
        empty.textContent = '此期間尚無記錄'
        content.appendChild(empty)
      }
    }

    // Lightbox
    function openLightbox(src) {
      const overlay = document.getElementById('lightbox')
      document.getElementById('lightbox-img').src = src
      overlay.classList.remove('hidden')
      document.body.style.overflow = 'hidden'
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden')
      document.body.style.overflow = ''
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox() })

    load()
  </script>

  <!-- Lightbox overlay -->
  <div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onclick="closeLightbox()">
    <img id="lightbox-img" src="" class="max-w-full max-h-full rounded-2xl object-contain shadow-2xl" onclick="event.stopPropagation()" />
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white text-3xl leading-none bg-black/40 rounded-full w-10 h-10 flex items-center justify-center hover:bg-black/60">✕</button>
  </div>
</body>
</html>
